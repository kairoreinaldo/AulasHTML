<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Trabalho com Listas</h1>
    <h2>Listas Ordenadas</h2>
    <ol>
        <li>Acordar</li>
        <li>Tomar café</li>
        <li>Estudar</li>
        <li>Tomar água</li>
        <li>Fazer exercícios</li>
        <li>Tomar banho</li>
    </ol>
    <H1>Listas Nao ordenadas</H1>
    <ul>
        <li>Pão</li>
    </ul>
    <H1>Lista de Definições</H1>
    <dl>
        <dt>HTML</dt>
        <dd>HTML</dd>
    </dl>
</body>
</html>
